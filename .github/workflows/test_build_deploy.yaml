name: Test build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  id-token: write
  pull-requests: read
  
env:
  AWS_REGION: eu-west-3

jobs:
  test:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_P }}

      - name: Authenticate uv with AWS CodeArtifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain konverso \
            --domain-owner 872515286329 \
            --region "${AWS_REGION}" \
            --query authorizationToken \
            --output text)
          echo "UV_INDEX_KONVERSO_AWS_PYPI_PROXY_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_KONVERSO_AWS_PYPI_PROXY_PASSWORD=$TOKEN" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: uv sync --all-groups --locked --no-editable

      # Bug-finding gate. ruff.toml selects ALL rules: the codebase does not
      # meet it yet, so only these rules (and pylint errors) block the build.
      - name: Lint with Ruff
        run: uv run --no-sync ruff check --select F,E9,B,PLE kbot_client examples

      - name: Lint with Pylint (errors only)
        run: uv run --no-sync pylint --errors-only kbot_client examples tests

      - name: Type check with ty
        run: uv run --no-sync ty check kbot_client examples tests

      - name: Run tests
        run: uv run --no-sync pytest

  build-push:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    name: Build and push to PyPi
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_P }}

      - name: Authenticate uv with AWS CodeArtifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain konverso \
            --domain-owner 872515286329 \
            --region "${AWS_REGION}" \
            --query authorizationToken \
            --output text)
          echo "UV_INDEX_KONVERSO_AWS_PYPI_PROXY_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_KONVERSO_AWS_PYPI_PROXY_PASSWORD=$TOKEN" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: uv sync --all-groups --locked --no-editable

      - name: Build
        run: uv build

      - name: Publish to PyPi
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
