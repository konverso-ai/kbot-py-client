name: Test build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  id-token: write
  pull-requests: read
  
env:
  AWS_REGION: eu-west-3

jobs:
  test:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_P }}

      - name: Authenticate uv with AWS CodeArtifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain konverso \
            --domain-owner 872515286329 \
            --region "${AWS_REGION}" \
            --query authorizationToken \
            --output text)
          echo "UV_INDEX_KONVERSO_AWS_PYPI_PROXY_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_KONVERSO_AWS_PYPI_PROXY_PASSWORD=$TOKEN" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: uv sync --all-groups --locked --no-editable

      # - name: Lint code with Ruff
      #   run: poetry run ruff check

      # - name: Run Pylint
      #   run: poetry run pylint .

  build-push:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    name: Build and push to PyPi
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_P }}

      - name: Authenticate uv with AWS CodeArtifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain konverso \
            --domain-owner 872515286329 \
            --region "${AWS_REGION}" \
            --query authorizationToken \
            --output text)
          echo "UV_INDEX_KONVERSO_AWS_PYPI_PROXY_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_KONVERSO_AWS_PYPI_PROXY_PASSWORD=$TOKEN" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: uv sync --all-groups --locked --no-editable

      - name: Build
        run: uv build

      - name: Publish to PyPi
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}