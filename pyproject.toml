[project]
name = "kbot-py-client"
version = "2.1.4"
requires-python = ">=3.10"
description = "Client for Konverso Kbot."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Konverso", email = "contact@konverso.ai" }
]
classifiers=[
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.32.5",
]

[project.urls]
Homepage = "https://www.konverso.ai/"
Source = "https://github.com/konverso-ai/kbot-py-client"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kbot_client"
module-root = ""

[tool.deptry]
# The default "tests" exclude only matches a top-level tests/ folder (re.match
# anchors at the start), so nested test dirs like core/.../tests/ are missed,
# making deptry flag pytest (a dev dependency) as used in "non-dev" code.
extend_exclude = [
    "(^|.*/)tests/",
]
known_first_party = [
    "kbot_client",
]

[dependency-groups]
deps = [
    "deptry",
]
lint = [
    "pylint",
    "ruff",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]
typecheck = [
    "ty",
]
dev = [
    { include-group = "deps" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "test" },
]
